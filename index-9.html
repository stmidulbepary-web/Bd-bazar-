<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BD Bazar</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans Bengali",sans-serif;background:#f5f7fb;color:#101828}
.nav{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #e5e7eb;padding:12px 16px;display:flex;gap:10px;align-items:center}
.logo{font-size:24px;font-weight:900}.logo b{color:#1769ff}.search{flex:1}.search input{width:100%;padding:12px 15px;border:1px solid #ddd;border-radius:12px}
.btn{padding:12px 15px;border-radius:11px;font-weight:800;cursor:pointer;border:0}.blue{background:#1769ff;color:#fff}
.wrap{max-width:1150px;margin:auto;padding:20px}.hero{background:linear-gradient(120deg,#12213f,#1769ff);color:#fff;padding:38px 25px;border-radius:25px;margin-bottom:25px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;overflow:hidden}.card img{width:100%;aspect-ratio:1.1;object-fit:cover}.body{padding:16px}
.tag{display:inline-block;background:#eaf2ff;color:#175cd3;padding:5px 9px;border-radius:20px;font-size:12px;font-weight:bold}.price{font-size:23px;font-weight:900;margin:12px 0}.order-btn{width:100%}
.modal{display:none;position:fixed;inset:0;background:#0009;z-index:50;padding:15px;overflow:auto}.modal.on{display:flex;align-items:center;justify-content:center}
.box{background:#fff;border-radius:20px;padding:20px;width:min(650px,100%);position:relative}.close{position:absolute;right:10px;top:10px;background:#eee;border:0;border-radius:50%;padding:8px 11px}
.field{margin:12px 0}.field label{display:block;font-weight:800;margin-bottom:6px}.field input,.field select{width:100%;padding:12px;border:1px solid #d0d5dd;border-radius:10px}
.summary{background:#f8fafc;padding:15px;border-radius:12px;margin:12px 0}.row{display:flex;justify-content:space-between;padding:6px 0}.total{font-size:20px;font-weight:900;border-top:1px solid #ddd;margin-top:8px;padding-top:10px}
.payment{background:#fff7ed;color:#9a3412;padding:13px;border-radius:11px;margin:12px 0}.empty{text-align:center;padding:40px}.foot{background:#0b1220;color:#ddd;padding:30px 20px;margin-top:30px}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:550px){.grid{grid-template-columns:1fr}.nav{flex-wrap:wrap}.search{order:3;flex-basis:100%}}
</style>
</head>
<body>
<nav class="nav">
<div class="logo">🛍️ BD <b>Bazar</b></div>
<div class="search"><input id="search" placeholder="পণ্য খুঁজুন..." oninput="showProducts()"></div>
<a class="btn" href="tel:01954959814">📞 কল</a>
</nav>

<main class="wrap">
<section class="hero"><h1>BD Bazar</h1><p>আপনার পছন্দের পণ্য দেখুন এবং এখনই অর্ডার করুন।</p></section>
<div id="products"><div class="empty">পণ্য লোড হচ্ছে...</div></div>
</main>

<footer class="foot">
<b>🛍️ BD Bazar</b>
<p>📞 01954959814</p>
<p>🚚 ঢাকার ভিতরে ডেলিভারি ৳70</p>
<p>🚚 ঢাকার বাইরে ডেলিভারি ৳130</p>
<p>💰 ডেলিভারি চার্জ অগ্রিম পরিশোধ করতে হবে।</p>
<p>💵 পণ্যের বাকি টাকা Cash on Delivery।</p>
</footer>

<div id="modal" class="modal" onclick="if(event.target===this)closeModal()"><div id="box" class="box"></div></div>

<script>
const SUPABASE_URL="https://dpvjyhnhcouyaidcmlpj.supabase.co";
const SUPABASE_KEY="sb_publishable_xKLBeCF_oU_DQ-393vriTQ_eY_7Tpri";
const FUNCTION_URL=SUPABASE_URL+"/functions/v1/order";
const WHATSAPP="8801954959814";
const BKASH="01954959814";
const NAGAD="01954959814";
const DHAKA=70,OUTSIDE=130;
let products=[];

async function loadProducts(){
try{
const r=await fetch(SUPABASE_URL+"/rest/v1/products?select=*&active=eq.true&order=id.desc",{headers:{apikey:SUPABASE_KEY,Authorization:"Bearer "+SUPABASE_KEY}});
if(!r.ok)throw Error();
products=await r.json();showProducts();
}catch(e){document.getElementById("products").innerHTML='<div class="empty"><h2>পণ্য লোড হয়নি</h2><p>Admin Panel থেকে পণ্য যোগ করুন।</p></div>'}
}

function money(n){return "৳"+Number(n).toLocaleString("bn-BD")}
function esc(x){return String(x??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}

function showProducts(){
let q=(document.getElementById("search").value||"").toLowerCase();
let list=products.filter(p=>(p.name+" "+(p.category||"")+" "+(p.description||"")).toLowerCase().includes(q));
if(!list.length){document.getElementById("products").innerHTML='<div class="empty"><h2>কোনো পণ্য পাওয়া যায়নি</h2></div>';return}
document.getElementById("products").innerHTML='<h2>সব Product</h2><div class="grid">'+list.map(p=>{
let img=Array.isArray(p.images)&&p.images[0]?p.images[0]:"";
return `<article class="card">${img?`<img src="${esc(img)}" alt="${esc(p.name)}">`:""}<div class="body"><span class="tag">${esc(p.category||"Product")}</span><h3>${esc(p.name)}</h3><p>${esc((p.description||"").replace(/\n/g," ").slice(0,120))}</p><div class="price">${money(p.price)}</div><button class="btn blue order-btn" onclick="order(${p.id})">🛒 এখনই অর্ডার করুন</button></div></article>`
}).join("")+"</div>";
}

function order(id){
let p=products.find(x=>x.id==id);if(!p)return;
document.getElementById("box").innerHTML=`<button class="close" onclick="closeModal()">✕</button>
<h2>🛒 অর্ডার করুন</h2><div class="summary"><div class="row"><span>পণ্য</span><b>${esc(p.name)}</b></div><div class="row"><span>দাম</span><b>${money(p.price)}</b></div></div>
<div class="field"><label>পরিমাণ *</label><input id="qty" type="number" min="1" value="1" oninput="calc(${id})"></div>
<div id="total"></div>
<div class="field"><label>নাম *</label><input id="name" placeholder="আপনার নাম"></div>
<div class="field"><label>মোবাইল নাম্বার *</label><input id="phone" placeholder="01XXXXXXXXX"></div>
<div class="field"><label>গ্রামের নাম *</label><input id="village" placeholder="গ্রামের নাম"></div>
<div class="field"><label>উপজেলা *</label><input id="upazila" placeholder="উপজেলার নাম"></div>
<div class="field"><label>জেলা *</label><input id="district" placeholder="জেলার নাম"></div>
<div class="field"><label>ডেলিভারি এলাকা *</label><select id="area" onchange="calc(${id});pay()"><option value="">নির্বাচন করুন</option><option value="ঢাকার ভিতরে">ঢাকার ভিতরে — ৳70</option><option value="ঢাকার বাইরে">ঢাকার বাইরে — ৳130</option></select></div>
<div class="field"><label>অগ্রিম পেমেন্ট *</label><select id="method" onchange="pay()"><option value="">নির্বাচন করুন</option><option value="বিকাশ">📱 বিকাশ</option><option value="নগদ">📱 নগদ</option></select></div>
<div id="pay"></div><button class="btn blue order-btn" onclick="sendOrder(${id})">✅ অর্ডার নিশ্চিত করুন</button>`;
document.getElementById("modal").classList.add("on");calc(id);
}

function calc(id){
let p=products.find(x=>x.id==id),q=Math.max(1,Number(document.getElementById("qty")?.value||1)),a=document.getElementById("area")?.value||"",d=a==="ঢাকার ভিতরে"?DHAKA:a==="ঢাকার বাইরে"?OUTSIDE:0,s=p.price*q;
document.getElementById("total").innerHTML=`<div class="summary"><div class="row"><span>পণ্যের মোট</span><b>${money(s)}</b></div><div class="row"><span>ডেলিভারি</span><b>${d?money(d):"এলাকা নির্বাচন করুন"}</b></div><div class="row total"><span>মোট</span><b>${money(s+d)}</b></div></div>`;
}

function pay(){
let m=document.getElementById("method")?.value,a=document.getElementById("area")?.value,d=a==="ঢাকার ভিতরে"?DHAKA:a==="ঢাকার বাইরে"?OUTSIDE:0;
if(!m){document.getElementById("pay").innerHTML="";return}
if(!d){document.getElementById("pay").innerHTML='<div class="payment">আগে ডেলিভারি এলাকা নির্বাচন করুন।</div>';return}
let n=m==="বিকাশ"?BKASH:NAGAD;
document.getElementById("pay").innerHTML=`<div class="payment">📱 ${m} নম্বর: <b>${n}</b><br><br>অগ্রিম দিতে হবে: <b>${money(d)}</b></div>`;
}

async function sendOrder(id){
let p=products.find(x=>x.id==id),name=document.getElementById("name").value.trim(),phone=document.getElementById("phone").value.trim(),village=document.getElementById("village").value.trim(),upazila=document.getElementById("upazila").value.trim(),district=document.getElementById("district").value.trim(),area=document.getElementById("area").value,method=document.getElementById("method").value,q=Math.max(1,Number(document.getElementById("qty").value||1));
if(!name||!phone||!village||!upazila||!district||!area||!method){alert("সব তথ্য পূরণ করুন।");return}
let d=area==="ঢাকার ভিতরে"?DHAKA:OUTSIDE,s=p.price*q,total=s+d;
let data={customer_name:name,phone,village,upazila,district,delivery_area:area,delivery_charge:d,items:[{product_id:p.id,product_name:p.name,quantity:q,price:Number(p.price)}],subtotal:s,total,payment_method:method};
try{
let r=await fetch(FUNCTION_URL,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});
let result={};try{result=await r.json()}catch(e){}
if(!r.ok||!result.success){alert(result.message||"Order Save হয়নি।");return}
let msg=`🛍️ BD Bazar New Order\n\n📦 Product: ${p.name}\n🔢 Quantity: ${q}\n💰 Product Price: ${money(s)}\n👤 নাম: ${name}\n📱 মোবাইল: ${phone}\n🌳 গ্রাম: ${village}\n🏘️ উপজেলা: ${upazila}\n📍 জেলা: ${district}\n🚚 Delivery: ${area}\n💵 Advance Delivery Charge: ${money(d)}\n📱 Payment: ${method}\n💰 Product Balance: ${money(s)}\n➡️ বাকি টাকা Cash on Delivery।`;
window.open("https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent(msg),"_blank");
document.getElementById("box").innerHTML='<div style="text-align:center;padding:25px"><div style="font-size:55px">✅</div><h2>অর্ডার সফল হয়েছে!</h2><p>অর্ডার গ্রহণ করা হয়েছে। WhatsApp-এ মেসেজ পাঠানোর জন্য Send চাপুন।</p><button class="btn blue" onclick="closeModal()">ঠিক আছে</button></div>';
}catch(e){alert("Server-এর সাথে যোগাযোগ করা যাচ্ছে না।")}
}

function closeModal(){document.getElementById("modal").classList.remove("on")}
loadProducts();
</script>
</body>
</html>
