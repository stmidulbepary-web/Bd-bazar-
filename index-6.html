<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="BD Bazar">
<title>BD Bazar — Online Store</title>
<style>
:root{--primary:#111827;--accent:#2563eb;--bg:#f6f7fb;--card:#fff;--text:#111827;--muted:#6b7280;--danger:#dc2626;--border:#e5e7eb}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Arial,"Noto Sans Bengali",sans-serif;background:var(--bg);color:var(--text)}
button,input,textarea,select{font:inherit}
button{cursor:pointer;border:0}
header{position:sticky;top:0;z-index:20;background:#fff;border-bottom:1px solid var(--border)}
.nav{max-width:1200px;margin:auto;padding:14px 18px;display:flex;align-items:center;gap:18px}
.logo{font-size:24px;font-weight:800;color:var(--primary);margin-right:auto}
.logo span{color:var(--accent)}
.search{width:min(420px,42vw);padding:11px 14px;border:1px solid var(--border);border-radius:12px;outline:0}
.cart-btn{background:var(--primary);color:#fff;padding:11px 15px;border-radius:12px;font-weight:700}
.hero{max-width:1200px;margin:24px auto;padding:42px 24px;border-radius:24px;background:linear-gradient(135deg,#111827,#2563eb);color:#fff}
.hero h1{font-size:clamp(30px,5vw,54px);margin-bottom:10px}
.hero p{max-width:650px;line-height:1.7;color:#e5e7eb}
.container{max-width:1200px;margin:0 auto;padding:0 18px 40px}
.toolbar{display:flex;justify-content:space-between;align-items:center;gap:12px;margin:20px 0}
select{padding:10px;border:1px solid var(--border);border-radius:10px;background:#fff}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:18px}
.card{background:var(--card);border:1px solid var(--border);border-radius:18px;overflow:hidden;box-shadow:0 4px 16px #00000008}
.card img{width:100%;aspect-ratio:1/1;object-fit:cover;background:#eee}
.card-body{padding:14px}
.card h3{font-size:17px;margin-bottom:8px}
.price{font-size:19px;font-weight:800;margin:8px 0 12px}
.muted{color:var(--muted);font-size:14px}
.add{width:100%;background:var(--accent);color:#fff;padding:11px;border-radius:10px;font-weight:700}
.empty{text-align:center;padding:60px 10px;color:var(--muted)}
.overlay{display:none;position:fixed;inset:0;background:#0008;z-index:50}
.overlay.show{display:block}
.drawer{position:absolute;right:0;top:0;height:100%;width:min(480px,100%);background:#fff;padding:20px;overflow:auto}
.drawer-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}
.close{background:#f3f4f6;border-radius:50%;width:38px;height:38px}
.cart-item{display:grid;grid-template-columns:64px 1fr auto;gap:10px;padding:12px 0;border-bottom:1px solid var(--border);align-items:center}
.cart-item img{width:64px;height:64px;object-fit:cover;border-radius:10px}
.qty{display:flex;align-items:center;gap:8px;margin-top:7px}
.qty button{width:28px;height:28px;border-radius:7px;background:#eef2ff}
.remove{color:var(--danger);font-size:13px;background:none;margin-top:5px}
.total{font-size:22px;font-weight:800;padding:18px 0}
.checkout{width:100%;background:#16a34a;color:#fff;padding:13px;border-radius:11px;font-weight:800}
.form{display:none;margin-top:20px;border-top:1px solid var(--border);padding-top:18px}
.form.show{display:block}
.field{margin-bottom:12px}
.field label{display:block;font-size:14px;font-weight:700;margin-bottom:6px}
.field input,.field textarea{width:100%;padding:11px;border:1px solid var(--border);border-radius:10px;outline:0}
.field textarea{min-height:80px;resize:vertical}
.order{width:100%;background:var(--primary);color:#fff;padding:13px;border-radius:11px;font-weight:800}
footer{text-align:center;padding:28px;color:var(--muted);background:#fff;border-top:1px solid var(--border)}
@media(max-width:900px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(max-width:650px){.nav{flex-wrap:wrap}.search{order:3;width:100%}.grid{grid-template-columns:repeat(2,1fr);gap:12px}.hero{margin:12px 12px 20px;padding:30px 20px}.container{padding:0 12px 30px}.card h3{font-size:15px}.price{font-size:17px}}
</style>
</head>
<body>
<header>
  <div class="nav">
    <div class="logo">BD <span>Bazar</span></div>
    <input id="search" class="search" placeholder="পণ্য খুঁজুন..." aria-label="পণ্য খুঁজুন">
    <button class="cart-btn" onclick="openCart()">🛒 কার্ট (<span id="cartCount">0</span>)</button>
  </div>
</header>

<section class="hero">
  <h1>BD Bazar-এ স্বাগতম</h1>
  <p>জনপ্রিয় gadget পণ্য বেছে নিন, কার্টে যোগ করুন এবং সহজে Cash on Delivery-তে অর্ডার করুন।</p>
</section>

<main class="container">
  <div class="toolbar">
    <strong id="resultText">সব পণ্য</strong>
    <select id="sort" onchange="render()">
      <option value="default">সাজানো: ডিফল্ট</option>
      <option value="low">দাম: কম থেকে বেশি</option>
      <option value="high">দাম: বেশি থেকে কম</option>
    </select>
  </div>
  <div id="products" class="grid"></div>
</main>

<footer>© 2026 MyShop — BD Bazar</footer>

<div id="overlay" class="overlay" onclick="outsideClose(event)">
  <aside class="drawer">
    <div class="drawer-head">
      <h2>আপনার কার্ট</h2>
      <button class="close" onclick="closeCart()">✕</button>
    </div>
    <div id="cartItems"></div>
    <div class="total">মোট: ৳<span id="total">0</span></div>
    <button class="checkout" onclick="showForm()">অর্ডার করতে এগিয়ে যান</button>

    <div id="form" class="form">
      <h3 style="margin-bottom:12px">ডেলিভারি তথ্য</h3>
      <div class="field"><label>নাম *</label><input id="name" required></div>
      <div class="field"><label>মোবাইল নম্বর *</label><input id="phone" type="tel" placeholder="01XXXXXXXXX"></div>
      <div class="field"><label>সম্পূর্ণ ঠিকানা *</label><textarea id="address"></textarea></div>
      <div class="field"><label>নোট (ঐচ্ছিক)</label><textarea id="note"></textarea></div>
      <button class="order" onclick="placeOrder()">অর্ডার কনফার্ম করুন</button>
      <p class="muted" style="margin-top:10px">পেমেন্ট: Cash on Delivery</p>
    </div>
  </aside>
</div>

<script>
/* =========================
   আপনার পণ্য এখানে পরিবর্তন করুন
   image URL-এ নিজের ছবির লিংক বসান
   ========================= */
const products = [
  {id:1,name:"Wireless Mini Gadget",price:650,category:"Gadget",image:"https://images.unsplash.com/photo-1594787318286-3d835c1d207f?auto=format&fit=crop&w=800&q=80"},
  {id:2,name:"Smart LED Gadget",price:850,category:"Gadget",image:"https://images.unsplash.com/photo-1587654780291-39c9404d746b?auto=format&fit=crop&w=800&q=80"},
  {id:3,name:"Portable Tech Gadget",price:950,category:"Gadget",image:"https://images.unsplash.com/photo-1560969184-10fe8719e047?auto=format&fit=crop&w=800&q=80"},
  {id:4,name:"USB Rechargeable Gadget",price:550,category:"Gadget",image:"https://images.unsplash.com/photo-1503736334956-4c8f8e92946d?auto=format&fit=crop&w=800&q=80"}
];

let cart = JSON.parse(localStorage.getItem("myshop_cart") || "[]");

function money(n){return Number(n).toLocaleString("en-BD");}

function render(){
  const q=document.getElementById("search").value.trim().toLowerCase();
  let list=products.filter(p=>p.name.toLowerCase().includes(q)||p.category.toLowerCase().includes(q));
  const sort=document.getElementById("sort").value;
  if(sort==="low") list.sort((a,b)=>a.price-b.price);
  if(sort==="high") list.sort((a,b)=>b.price-a.price);
  document.getElementById("resultText").textContent=q?`${list.length}টি পণ্য পাওয়া গেছে`:"সব পণ্য";
  document.getElementById("products").innerHTML=list.length?list.map(p=>`
    <article class="card">
      <img src="${p.image}" alt="${p.name}" loading="lazy">
      <div class="card-body">
        <h3>${p.name}</h3>
        <div class="muted">${p.category}</div>
        <div class="price">৳${money(p.price)}</div>
        <button class="add" onclick="addToCart(${p.id})">🛒 কার্টে যোগ করুন</button>
      </div>
    </article>`).join(""):`<div class="empty" style="grid-column:1/-1">কোনো পণ্য পাওয়া যায়নি।</div>`;
}

function addToCart(id){
  const item=cart.find(x=>x.id===id);
  if(item)item.qty++;
  else cart.push({id,qty:1});
  save(); openCart();
}

function changeQty(id,delta){
  const item=cart.find(x=>x.id===id);
  if(!item)return;
  item.qty+=delta;
  if(item.qty<=0)cart=cart.filter(x=>x.id!==id);
  save(); renderCart();
}

function removeItem(id){
  cart=cart.filter(x=>x.id!==id);
  save(); renderCart();
}

function save(){localStorage.setItem("myshop_cart",JSON.stringify(cart));updateCount();}

function updateCount(){
  document.getElementById("cartCount").textContent=cart.reduce((s,x)=>s+x.qty,0);
}

function renderCart(){
  const box=document.getElementById("cartItems");
  if(!cart.length){
    box.innerHTML='<div class="empty">আপনার কার্ট খালি।</div>';
    document.getElementById("total").textContent="0";
    return;
  }
  let total=0;
  box.innerHTML=cart.map(x=>{
    const p=products.find(a=>a.id===x.id);
    const subtotal=p.price*x.qty; total+=subtotal;
    return `<div class="cart-item">
      <img src="${p.image}" alt="">
      <div><strong>${p.name}</strong><div class="muted">৳${money(p.price)} × ${x.qty}</div>
      <div class="qty">
        <button onclick="changeQty(${p.id},-1)">−</button><span>${x.qty}</span><button onclick="changeQty(${p.id},1)">+</button>
      </div>
      <button class="remove" onclick="removeItem(${p.id})">পণ্যটি সরান</button></div>
      <strong>৳${money(subtotal)}</strong>
    </div>`;
  }).join("");
  document.getElementById("total").textContent=money(total);
}

function openCart(){
  document.getElementById("overlay").classList.add("show");
  document.getElementById("form").classList.remove("show");
  renderCart();
}
function closeCart(){document.getElementById("overlay").classList.remove("show")}
function outsideClose(e){if(e.target.id==="overlay")closeCart()}
function showForm(){
  if(!cart.length){alert("আগে একটি পণ্য কার্টে যোগ করুন।");return;}
  document.getElementById("form").classList.add("show");
}

function placeOrder(){
  const name=document.getElementById("name").value.trim();
  const phone=document.getElementById("phone").value.trim();
  const address=document.getElementById("address").value.trim();
  if(!name||!phone||!address){alert("নাম, মোবাইল নম্বর ও ঠিকানা পূরণ করুন।");return;}
  if(!/^01\\d{9}$/.test(phone)){alert("সঠিক ১১ সংখ্যার বাংলাদেশি মোবাইল নম্বর দিন।");return;}

  const lines=cart.map(x=>{
    const p=products.find(a=>a.id===x.id);
    return `${p.name} × ${x.qty} = ৳${p.price*x.qty}`;
  }).join("\\n");
  const total=cart.reduce((s,x)=>s+products.find(p=>p.id===x.id).price*x.qty,0);

  /*
    আপনার WhatsApp নম্বর এখানে বসান।
    বাংলাদেশি নম্বরের আগে 88 দিন।
    উদাহরণ: 8801XXXXXXXXX
  */
  const shopWhatsApp="8801954959814";

  const message=
`নতুন অর্ডার — MyShop

নাম: ${name}
মোবাইল: ${phone}
ঠিকানা: ${address}
নোট: ${document.getElementById("note").value.trim() || "নেই"}

পণ্য:
${lines}

মোট: ৳${money(total)}
পেমেন্ট: Cash on Delivery`;

  if(shopWhatsApp==="8801954959814"){
    alert("অর্ডার তৈরি হয়েছে।\\n\\nWhatsApp অর্ডার চালু করতে কোডের shopWhatsApp-এ আপনার WhatsApp নম্বর বসান।");
    return;
  }

  window.open("https://wa.me/"+shopWhatsApp+"?text="+encodeURIComponent(message),"_blank");
  cart=[]; save(); closeCart();
  alert("অর্ডার পাঠানোর জন্য WhatsApp খোলা হয়েছে।");
}

document.getElementById("search").addEventListener("input",render);
render(); updateCount();
</script>
</body>
</html>
