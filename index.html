   GET PRODUCT FROM URL
========================================= */

function getProductFromURL(){

const params=
new URLSearchParams(window.location.search);

const id=params.get("product");

if(!id)return null;

return products.find(
p=>String(p.id)===String(id)
);

}

const p=getProductFromURL();

if(!p)return;

const data={
title:p.name,
text:
p.name+
" — "+
money(p.price)+
"\n\nঅর্ডার করতে Link-এ যান:",
url:productLink()
};


if(navigator.share){

try{

await navigator.share(data);

}catch(e){}

}else{

copyProductLink();

}

}

/* =========================================
   CALCULATE
========================================= */

function calculateOrder(id){

const p=
products.find(x=>x.id===id);

if(!p)return;


const qty=
Math.max(
1,
Number(
document.getElementById("quantity")?.value||1
)
);


const area=
document.getElementById("deliveryArea")?.value||"";


let delivery=0;

if(area==="dhaka")delivery=DHAKA_DELIVERY;

if(area==="outside")delivery=OUTSIDE_DELIVERY;


const productTotal=
p.price*qty;


document.getElementById("orderTotal").innerHTML=`

<div class="summary">

<div class="summary-row">

<span>Product Total</span>

<b>${money(productTotal)}</b>

</div>


<div class="summary-row">

<span>ডেলিভারি চার্জ অগ্রিম</span>

<b>${delivery?money(delivery):"এলাকা নির্বাচন করুন"}</b>

</div>


<div class="summary-row total">

<span>অর্ডারের মোট</span>

<b>${money(productTotal+delivery)}</b>

</div>

</div>

`;

}


/* =========================================
   PAYMENT INFO
========================================= */

function showPayment(id){

const method=
document.getElementById("paymentMethod").value;

const area=
document.getElementById("deliveryArea").value;


let charge=0;

if(area==="dhaka")charge=DHAKA_DELIVERY;

if(area==="outside")charge=OUTSIDE_DELIVERY;


if(!method){

document.getElementById("paymentInfo").innerHTML="";

return;

}


if(!charge){

document.getElementById("paymentInfo").innerHTML=`

<div class="payment">

আগে Delivery Area নির্বাচন করুন।

</div>

`;

return;

}


const number=
method==="bKash"
?BKASH
:NAGAD;


document.getElementById("paymentInfo").innerHTML=`

<b>
${method==="bKash"?"📱 বিকাশ":"📱 নগদ"}
</b>

}

document.getElementById("paymentMethod")
.value;

const qty=
Math.max(
1,
Number(
document.getElementById("quantity")
.value||1
)
);


if(
!name||
!phone||
!village||
!upazila||
!district
){

alert(
"নাম, মোবাইল, গ্রাম, উপজেলা ও জেলা পূরণ করুন।"
);

return;

}


if(!area){

alert(
"ডেলিভারি এলাকা নির্বাচন করুন।"
);

return;

}


if(!payment){

alert(
"ডেলিভারি চার্জ অগ্রিম পরিশোধের মাধ্যম নির্বাচন করুন।"
);

return;

}


const deliveryCharge=
area==="dhaka"
?DHAKA_DELIVERY
:OUTSIDE_DELIVERY;


const areaName=
area==="dhaka"
?"ঢাকার ভিতরে"
:"ঢাকার বাইরে";


const subtotal=
p.price*qty;


const total=
subtotal+deliveryCharge;


const orderItems=[

{
product_id:p.id,
product_name:p.name,
quantity:qty,
price:p.price
}

];


const data={

customer_name:name,

phone:phone,

village:village,

upazila:upazila,

district:district,

delivery_area:areaName,

delivery_charge:deliveryCharge,

items:orderItems,

subtotal:subtotal,

total:total,

payment_method:payment,

status:"new"

};


try{


/* Supabase */

const response=
await fetch(
SUPABASE_FUNCTION,
{
method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify(data)

}
);


const result=
await response.json();


if(
!response.ok||
!result.success
){

console.error(result);

alert(
"Order Save হয়নি। আবার চেষ্টা করুন।"
);

return;

}


/* WhatsApp */

const message=

`🛍️ BD Bazar New Order

📦 Product: ${p.name}

🔢 Quantity: ${qty}

💰 Product Price: ${money(subtotal)}

👤 নাম: ${name}

📱 মোবাইল: ${phone}

🌳 গ্রাম: ${village}

🏘️ উপজেলা: ${upazila}

📍 জেলা: ${district}

🚚 Delivery: ${areaName}

💵 Delivery Charge Advance: ${money(deliveryCharge)}

📱 Advance Payment: ${payment}

💰 Product Balance: ${money(subtotal)}

➡️ Product-এর বাকি টাকা Cash on Delivery।`;


window.open(
"https://wa.me/"+
WHATSAPP+
"?text="+
encodeURIComponent(message),
"_blank"
);


/* Success */

document.getElementById(
"modalBox"
).innerHTML=`

<div class="success">

<div class="success-icon">
✅
</div>

<h2>
অর্ডার সফল হয়েছে!
</h2>

<p>
আপনার অর্ডার গ্রহণ করা হয়েছে।
</p>

<div class="summary">

<p>
ডেলিভারি চার্জ অগ্রিম:
<b>${money(deliveryCharge)}</b>
</p>

<p>
পণ্যের বাকি টাকা:
<b>Cash on Delivery</b>
</p>

</div>

<button
class="btn blue"
onclick="closeModal()">

ঠিক আছে

</button>

</div>

`;


}catch(error){

console.error(error);

alert(
"Server-এর সাথে যোগাযোগ করা যাচ্ছে না।"
);

}

}


/* =========================================
   MODAL
========================================= */

function showModal(html){

document.getElementById(
"modalBox"
).innerHTML=html;

document.getElementById(
"modal"
).classList.add("on");

}


function closeModal(){

document.getElementById(
"modal"
).classList.remove("on");

}


/* =========================================
   START
========================================= */

renderProducts();

</script>

</body>
</html>
