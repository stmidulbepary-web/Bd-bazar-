<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BD Bazar</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,"Noto Sans Bengali",sans-serif;background:#f5f7fb;color:#101828}
button,input,select{font:inherit}
button{cursor:pointer;border:0}
.nav{position:sticky;top:0;z-index:10;background:#fff;border-bottom:1px solid #ddd;padding:12px 16px;display:flex;gap:10px;align-items:center}
.logo{font-size:24px;font-weight:900;white-space:nowrap}.logo b{color:#1769ff}
.search{flex:1}.search input{width:100%;padding:12px;border:1px solid #ddd;border-radius:12px}
.btn{padding:11px 14px;border-radius:11px;font-weight:700}
.blue{background:#1769ff;color:white}.dark{background:#101828;color:white}.red{background:#d92d20;color:white}
.wrap{max-width:1150px;margin:auto;padding:20px}
.hero{background:linear-gradient(120deg,#12213f,#1769ff);color:white;padding:35px 25px;border-radius:24px;margin-bottom:25px}
.hero h1{font-size:42px;margin:0 0 10px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}
.card{background:#fff;border:1px solid #e5e7eb;border-radius:18px;overflow:hidden}
.pic{width:100%;aspect-ratio:1.1;object-fit:cover}
.body{padding:15px}.tag{background:#eaf2ff;color:#175cd3;padding:5px 9px;border-radius:20px;font-size:12px;font-weight:bold}
.price{font-size:22px;font-weight:900;margin:12px 0}
.desc{color:#667085;line-height:1.5}
.actions{display:flex;gap:8px}.actions button{flex:1}
.modal{display:none;position:fixed;inset:0;background:#0008;z-index:30;padding:15px;overflow:auto}
.modal.on{display:flex;align-items:center;justify-content:center}
.box{background:white;border-radius:20px;padding:20px;width:min(760px,100%);position:relative}
.close{position:absolute;right:10px;top:10px;border-radius:50%;padding:8px 11px}
.detail{display:grid;grid-template-columns:1fr 1fr;gap:20px}
.detail img{width:100%;border-radius:15px}
.thumbs{display:flex;gap:8px;margin-top:8px}
.thumbs img{width:65px;height:65px;object-fit:cover;border-radius:8px;cursor:pointer;border:2px solid transparent}
.field{margin:10px 0}.field label{display:block;font-weight:bold;margin-bottom:5px}
.field input,.field select{width:100%;padding:12px;border:1px solid #ddd;border-radius:10px}
.sum{background:#f8fafc;padding:12px;border-radius:12px}
.cartitem{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #eee}
.cartitem img{width:55px;height:55px;object-fit:cover;border-radius:8px}
.cartinfo{flex:1}.qty{display:flex;gap:5px;align-items:center}
.qty button{width:30px;height:30px;border-radius:7px;background:#eee}
.remove{background:#fee4e2;color:#b42318;padding:7px;border-radius:8px}
.total{font-size:20px;font-weight:900;padding-top:12px}
.notice{background:#ecfdf3;color:#067647;padding:12px;border-radius:10px;line-height:1.6}
.delivery{background:#eff8ff;color:#175cd3;padding:12px;border-radius:10px;line-height:1.6;margin:12px 0}
.payment{background:#fff7ed;color:#9a3412;padding:12px;border-radius:10px;line-height:1.6;margin:10px 0}
.empty{text-align:center;padding:25px;color:#667085}
.foot{background:#0b1220;color:#ddd;padding:30px 20px;margin-top:30px}
.success{text-align:center;padding:25px}.success .icon{font-size:55px}
@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.detail{grid-template-columns:1fr}}
@media(max-width:550px){.grid{grid-template-columns:1fr}.nav{flex-wrap:wrap}.search{order:3;flex-basis:100%}.hero h1{font-size:32px}}
</style>
</head>

<body>

<nav class="nav">

<div class="logo">🛍️ BD <b>Bazar</b></div>

<div class="search">
<input id="q" oninput="render()" placeholder="পণ্য খুঁজুন...">
</div>

<a class="btn" href="tel:01954959814">📞 Call</a>

<button class="btn dark" onclick="cartOpen()">
🛒 Cart (<span id="cc">0</span>)
</button>

</nav>


<main class="wrap">

<section class="hero">
<h1>BD Bazar</h1>
<p>
Gadget কিনুন সহজে। Delivery Charge Advance,
বাকি Product Price Cash on Delivery।
</p>
</section>

<h2>সব Product</h2>

<div id="grid" class="grid"></div>

</main>


<footer class="foot">
<b>BD Bazar</b>
<p>📞 01954959814</p>
<p>🚚 ঢাকা ৳70 • ঢাকার বাইরে ৳130</p>
<p>💵 Delivery Charge Advance • Product COD</p>
</footer>


<div id="modal" class="modal" onclick="if(event.target===this)closeM()">
<div id="box" class="box"></div>
</div>


<script>

const WA="8801954959814";

const SUPABASE_FUNCTION=
"https://dpvjyhnhcouyaidcmlpj.supabase.co/functions/v1/bright-task";

const DHAKA_DELIVERY=70;
const OUTSIDE_DELIVERY=130;

const BKASH="01954959814";
const NAGAD="01954959814";


/* ==========================
   PRODUCTS
   ========================== */

const products=[

{
id:1,
name:"Wireless Mini Gadget",
price:650,
cat:"Gadgets",
images:[
"https://images.unsplash.com/photo-1587033411391-5d9e51cce126?auto=format&fit=crop&w=900&q=80",
"https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=900&q=80",
"https://images.unsplash.com/photo-1608043152269-423dbba4e7e1?auto=format&fit=crop&w=900&q=80"
],
desc:"ছোট ও ব্যবহারযোগ্য everyday gadget।"
},

{
id:2,
name:"Smart LED Gadget",
price:850,
cat:"Gadgets",
images:[
"https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=900&q=80",
"https://images.unsplash.com/photo-1587033411391-5d9e51cce126?auto=format&fit=crop&w=900&q=80"
],
desc:"Modern LED design ও আকর্ষণীয় look।"
},

{
id:3,
name:"Bluetooth Speaker",
price:1250,
cat:"Audio",
images:[
"https://images.unsplash.com/photo-1608043152269-423dbba4e7e1?auto=format&fit=crop&w=900&q=80",
"https://images.unsplash.com/photo-1587033411391-5d9e51cce126?auto=format&fit=crop&w=900&q=80"
],
desc:"Portable speaker—বাসা ও ভ্রমণের জন্য।"
},

{
id:4,
name:"Smart Watch",
price:1650,
cat:"Wearable",
images:[
"https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=900&q=80",
"https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=900&q=80"
],
desc:"স্টাইলিশ daily-use smart watch।"
},

{
id:5,
name:"USB Rechargeable Fan",
price:790,
cat:"Home Gadget",
images:[
"https://images.unsplash.com/photo-1561214115-f2f134cc4912?auto=format&fit=crop&w=900&q=80",
"https://images.unsplash.com/photo-1587033411391-5d9e51cce126?auto=format&fit=crop&w=900&q=80"
],
desc:"Desk বা personal cooling-এর জন্য।"
},

{
id:6,
name:"Fast Charging Cable",
price:390,
cat:"Accessories",
images:[
"https://images.unsplash.com/photo-1583863788434-e58a36330cf0?auto=format&fit=crop&w=900&q=80",
"https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=900&q=80"
],
desc:"দৈনন্দিন charging-এর জন্য practical cable।"
}

];


let cart=JSON.parse(localStorage.getItem("cart")||"[]");


function money(n){
return "৳"+Number(n).toLocaleString("bn-BD");
}


function save(){
localStorage.setItem("cart",JSON.stringify(cart));
document.getElementById("cc").textContent=
cart.reduce((a,x)=>a+x.qty,0);
}


function render(){

let q=document.getElementById("q").value.toLowerCase();

let list=products.filter(p=>
(p.name+p.cat+p.desc).toLowerCase().includes(q)
);

document.getElementById("grid").innerHTML=

list.map(p=>`

<article class="card">

<img class="pic" src="${p.images[0]}" alt="${p.name}">

<div class="body">

<span class="tag">${p.cat}</span>

<h3>${p.name}</h3>

<p class="desc">${p.desc}</p>

<div class="price">${money(p.price)}</div>

<div class="actions">

<button class="btn" onclick="details(${p.id})">
Details
</button>

<button class="btn blue" onclick="add(${p.id})">
🛒 Add
</button>

</div>

</div>

</article>

`).join("");

}


function add(id){

let x=cart.find(a=>a.id===id);

if(x)x.qty++;
else cart.push({id:id,qty:1});

save();

}


function details(id){

let p=products.find(x=>x.id===id);

show(`

<button class="close" onclick="closeM()">✕</button>

<div class="detail">

<div>

<img id="mainImg" src="${p.images[0]}">

<div class="thumbs">

${p.images.map(img=>`
<img src="${img}" onclick="document.getElementById('mainImg').src='${img}'">
`).join("")}

</div>

</div>

<div>

<span class="tag">${p.cat}</span>

<h2>${p.name}</h2>

<div class="price">${money(p.price)}</div>

<p class="desc">${p.desc}</p>

<div class="notice">
🚚 Delivery Charge Advance<br>
💵 Product Price Cash on Delivery
</div>

<button class="btn blue"
style="width:100%;margin-top:12px"
onclick="add(${p.id});closeM()">

🛒 Add to Cart

</button>

</div>

</div>

`);

}


function cartOpen(){

if(!cart.length){

show(`

<button class="close" onclick="closeM()">✕</button>

<div class="empty">
<h2>🛒 Cart খালি</h2>
<p>Product যোগ করুন।</p>
</div>

`);

return;

}


let items=cart.map(x=>{

let p=products.find(a=>a.id===x.id);

return `

<div class="cartitem">

<img src="${p.images[0]}">

<div class="cartinfo">

<b>${p.name}</b>

<br>

${money(p.price)}

</div>

<div class="qty">

<button onclick="changeQty(${p.id},-1)">−</button>

<b>${x.qty}</b>

<button onclick="changeQty(${p.id},1)">+</button>

</div>

<button class="remove"
onclick="removeItem(${p.id})">

🗑️

</button>

</div>

`;

}).join("");


let subtotal=cart.reduce(
(s,x)=>s+products.find(p=>p.id===x.id).price*x.qty,0
);


show(`

<button class="close" onclick="closeM()">✕</button>

<h2>🛒 Cart & Checkout</h2>

<div class="sum">

${items}

<div class="row total">
<span>Product Total</span>
<span>${money(subtotal)}</span>
</div>

</div>

<div class="field">

<label>নাম *</label>

<input id="name" placeholder="আপনার নাম">

</div>


<div class="field">

<label>মোবাইল নাম্বার *</label>

<input id="phone" placeholder="01XXXXXXXXX">

</div>


<div class="field">

<label>গ্রামের নাম *</label>

<input id="village" placeholder="গ্রামের নাম">

</div>


<div class="field">

<label>উপজেলা *</label>

<input id="upazila" placeholder="উপজেলার নাম">

</div>


<div class="field">

<label>জেলা *</label>

<input id="district" placeholder="জেলার নাম">

</div>


<div class="field">

<label>Delivery Area *</label>

<select id="area" onchange="updateTotal()">

<option value="">নির্বাচন করুন</option>

<option value="dhaka">
ঢাকার ভিতরে — ৳70
</option>

<option value="outside">
ঢাকার বাইরে — ৳130
</option>

</select>

</div>


<div id="deliveryBox"></div>


<div class="field">

<label>Delivery Charge Advance Payment *</label>

<select id="payment">

<option value="">Payment Method</option>

<option value="bKash">📱 bKash</option>

<option value="Nagad">📱 Nagad</option>

</select>

</div>


<div id="paymentInfo"></div>


<button class="btn blue"
style="width:100%"
onclick="order()">

✅ Order Confirm করুন

</button>

`);


document.getElementById("payment").addEventListener("change",showPayment);

}


function changeQty(id,n){

let x=cart.find(a=>a.id===id);

if(!x)return;

x.qty+=n;

if(x.qty<=0){

cart=cart.filter(a=>a.id!==id);

}

save();

cartOpen();

}


function removeItem(id){

cart=cart.filter(a=>a.id!==id);

save();

cartOpen();

}


function updateTotal(){

let area=document.getElementById("area").value;

let charge=0;

if(area==="dhaka")charge=DHAKA_DELIVERY;

if(area==="outside")charge=OUTSIDE_DELIVERY;

document.getElementById("deliveryBox").innerHTML=

charge?`

<div class="delivery">

🚚 Delivery Charge Advance:
<b>${money(charge)}</b>

<br>

Product-এর বাকি টাকা Delivery-এর সময়
<b>Cash on Delivery</b> দিতে হবে।

</div>

`:"";

}


function showPayment(){

let p=document.getElementById("payment").value;

let area=document.getElementById("area").value;

let charge=
area==="dhaka"
?DHAKA_DELIVERY
:OUTSIDE_DELIVERY;

if(!p){

document.getElementById("paymentInfo").innerHTML="";

return;

}

document.getElementById("paymentInfo").innerHTML=`

<div class="payment">

<b>${p} Delivery Charge Advance</b>

<br><br>

${p==="bKash"?"bKash Number":"Nagad Number"}:

<b>${p==="bKash"?BKASH:NAGAD}</b>

<br><br>

Advance Amount:
<b>${money(charge)}</b>

<br><br>

Transaction ID লাগবে না।

</div>

`;

}


async function order(){

let name=document.getElementById("name").value.trim();
let phone=document.getElementById("phone").value.trim();
let village=document.getElementById("village").value.trim();
let upazila=document.getElementById("upazila").value.trim();
let district=document.getElementById("district").value.trim();
let area=document.getElementById("area").value;
let payment=document.getElementById("payment").value;


if(!name||!phone||!village||!upazila||!district){

alert("সব Customer Information পূরণ করুন।");
return;

}


if(!area){

alert("Delivery Area নির্বাচন করুন।");
return;

}


if(!payment){

alert("Delivery Charge Advance-এর Payment Method নির্বাচন করুন।");
return;

}


let deliveryCharge=
area==="dhaka"
?DHAKA_DELIVERY
:OUTSIDE_DELIVERY;


let subtotal=0;


let orderItems=cart.map(x=>{

let p=products.find(a=>a.id===x.id);

subtotal+=p.price*x.qty;

return{
product_id:p.id,
product_name:p.name,
quantity:x.qty,
price:p.price
};

});


let total=subtotal+deliveryCharge;


let areaName=
area==="dhaka"
?"ঢাকার ভিতরে"
:"ঢাকার বাইরে";


let data={

customer_name:name,

phone:phone,

village:village,

upazila:upazila,

district:district,

delivery_area:areaName,

delivery_charge:deliveryCharge,

items:orderItems,

subtotal:subtotal,

total:total,

payment_method:payment,

status:"new"

};


try{

let response=await fetch(
SUPABASE_FUNCTION,
{
method:"POST",
headers:{
"Content-Type":"application/json"
},
body:JSON.stringify(data)
}
);


let result=await response.json();


if(!response.ok||!result.success){

console.error(result);

alert("Order Save হয়নি।");

return;

}


/* WhatsApp */

let productText=cart.map(x=>{

let p=products.find(a=>a.id===x.id);

return p.name+
" × "+
x.qty+
" = "+
money(p.price*x.qty);

}).join("\n");


let message=

`BD Bazar New Order

নাম: ${name}
মোবাইল: ${phone}
গ্রাম: ${village}
উপজেলা: ${upazila}
জেলা: ${district}

Delivery: ${areaName}

Products:
${productText}

Product Total:
${money(subtotal)}

Delivery Advance:
${money(deliveryCharge)}

Total:
${money(total)}

Advance Payment:
${payment}

Product Balance:
${money(subtotal)}

Product Balance হবে Cash on Delivery.`;


window.open(
"https://wa.me/"+WA+
"?text="+encodeURIComponent(message),
"_blank"
);


cart=[];

save();


document.getElementById("box").innerHTML=`

<div class="success">

<div class="icon">✅</div>

<h2>Order সফল হয়েছে!</h2>

<p>
আপনার Order গ্রহণ করা হয়েছে।
</p>

<p>
Delivery Charge Advance: <b>${money(deliveryCharge)}</b>
</p>

<p>
Product-এর বাকি টাকা Delivery-এর সময়
Cash on Delivery দিতে হবে।
</p>

<button class="btn blue" onclick="closeM()">
ঠিক আছে
</button>

</div>

`;


}catch(e){

console.error(e);

alert("Server-এর সাথে যোগাযোগ করা যাচ্ছে না।");

}

}


function show(x){

document.getElementById("box").innerHTML=x;

document.getElementById("modal").classList.add("on");

}


function closeM(){

document.getElementById("modal").classList.remove("on");

}


save();

render();

</script>

</body>
</html>
