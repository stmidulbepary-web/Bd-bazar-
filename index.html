<!doctype html><html lang="bn"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>BD Bazar — Gadget Shop</title>
<style>
:root{--b:#1769ff;--d:#101828;--m:#667085;--bg:#f5f7fb}*{box-sizing:border-box}body{margin:0;font-family:Arial,"Noto Sans Bengali",sans-serif;background:var(--bg);color:var(--d)}button,input,textarea,select{font:inherit}button{cursor:pointer;border:0}.nav{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #e5e7eb;padding:13px 18px;display:flex;gap:14px;align-items:center}.logo{font-size:25px;font-weight:900;white-space:nowrap}.logo b{color:var(--b)}.search{flex:1}.search input{width:100%;padding:12px 15px;border:1px solid #ddd;border-radius:13px}.btn{padding:12px 15px;border-radius:12px;font-weight:800}.blue{background:var(--b);color:#fff}.dark{background:var(--d);color:#fff}.wrap{max-width:1150px;margin:auto;padding:20px}.hero{padding:38px 28px;border-radius:26px;color:#fff;background:linear-gradient(120deg,#12213f,#1769ff);margin-bottom:25px}.hero h1{font-size:clamp(30px,5vw,52px);margin:0 0 10px}.hero p{font-size:18px;line-height:1.7}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px}.card{background:#fff;border:1px solid #e5e7eb;border-radius:19px;overflow:hidden}.pic{width:100%;aspect-ratio:1.15;object-fit:cover;background:#eef4ff}.body{padding:15px}.tag{color:#175cd3;background:#eaf2ff;padding:5px 9px;border-radius:99px;font-size:12px;font-weight:bold}.card h3{margin:10px 0 5px}.desc{color:var(--m);line-height:1.5;min-height:42px}.price{font-size:22px;font-weight:900;margin:12px 0}.actions{display:flex;gap:8px}.actions button{flex:1}.modal{display:none;position:fixed;inset:0;background:#0008;z-index:20;padding:18px;overflow:auto}.modal.on{display:flex;align-items:center;justify-content:center}.box{background:#fff;border-radius:20px;padding:20px;width:min(720px,100%);position:relative}.close{position:absolute;right:12px;top:10px;border-radius:50%;padding:8px 12px}.detail{display:grid;grid-template-columns:1fr 1fr;gap:20px}.detail img{width:100%;border-radius:15px}.field{margin:10px 0}.field label{display:block;font-weight:bold;margin-bottom:5px}.field input,.field textarea{width:100%;padding:12px;border:1px solid #ddd;border-radius:11px}.field textarea{min-height:85px}.sum{background:#f8fafc;padding:12px;border-radius:12px;margin:12px 0}.row{display:flex;justify-content:space-between;padding:6px 0}.total{border-top:1px solid #ddd;font-weight:900;font-size:19px}.notice{background:#ecfdf3;color:#067647;padding:11px;border-radius:11px;line-height:1.5}.foot{background:#0b1220;color:#ddd;padding:30px 20px;margin-top:30px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.detail{grid-template-columns:1fr}}@media(max-width:550px){.grid{grid-template-columns:1fr}.nav{flex-wrap:wrap}.search{order:3;flex-basis:100%}}
</style></head><body>
<nav class="nav"><a class="logo">🛍️ BD <b>Bazar</b></a><div class="search"><input id="q" oninput="render()" placeholder="পণ্য খুঁজুন..."></div><a class="btn" href="tel:01954959814">📞 Call</a><button class="btn dark" onclick="cartOpen()">🛒 Cart (<span id="cc">0</span>)</button></nav>
<main class="wrap"><section class="hero"><h1>BD Bazar — Gadget Store</h1><p>পছন্দের gadget বেছে নিন, Cart-এ যোগ করুন এবং <b>Cash on Delivery</b>-তে অর্ডার করুন। WhatsApp-এ অর্ডার পাঠানো যাবে।</p></section><h2>সব Gadget</h2><div id="grid" class="grid"></div></main>
<footer class="foot"><b>BD Bazar</b><p>📞 01954959814</p><p>💵 Cash on Delivery • 💬 WhatsApp Order</p></footer>
<div id="modal" class="modal" onclick="if(event.target===this)closeM()"><div id="box" class="box"></div></div>
<script>
const WA="8801954959814",PHONE="01954959814";
const products=[
{id:1,name:"Wireless Mini Gadget",price:650,cat:"Gadgets",img:"https://images.unsplash.com/photo-1587033411391-5d9e51cce126?auto=format&fit=crop&w=900&q=80",desc:"ছোট ও ব্যবহারযোগ্য everyday gadget।"},
{id:2,name:"Smart LED Gadget",price:850,cat:"Gadgets",img:"https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=900&q=80",desc:"Modern LED design ও আকর্ষণীয় look।"},
{id:3,name:"Bluetooth Speaker",price:1250,cat:"Audio",img:"https://images.unsplash.com/photo-1608043152269-423dbba4e7e1?auto=format&fit=crop&w=900&q=80",desc:"Portable speaker—বাসা ও ভ্রমণের জন্য।"},
{id:4,name:"Smart Watch",price:1650,cat:"Wearable",img:"https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=900&q=80",desc:"স্টাইলিশ daily-use smart watch।"},
{id:5,name:"USB Rechargeable Fan",price:790,cat:"Home Gadget",img:"https://images.unsplash.com/photo-1561214115-f2f134cc4912?auto=format&fit=crop&w=900&q=80",desc:"Desk বা personal cooling-এর জন্য।"},
{id:6,name:"Fast Charging Cable",price:390,cat:"Accessories",img:"https://images.unsplash.com/photo-1583863788434-e58a36330cf0?auto=format&fit=crop&w=900&q=80",desc:"দৈনন্দিন charging-এর জন্য practical cable।"}];
let cart=JSON.parse(localStorage.getItem("cart")||"[]");
const money=n=>"৳"+n.toLocaleString("bn-BD");
function save(){localStorage.setItem("cart",JSON.stringify(cart));document.getElementById("cc").textContent=cart.reduce((a,x)=>a+x.qty,0)}
function render(){let q=document.getElementById("q").value.toLowerCase();document.getElementById("grid").innerHTML=products.filter(p=>(p.name+p.cat+p.desc).toLowerCase().includes(q)).map(p=>`<article class="card"><img class="pic" src="${p.img}"><div class="body"><span class="tag">${p.cat}</span><h3>${p.name}</h3><p class="desc">${p.desc}</p><div class="price">${money(p.price)}</div><div class="actions"><button class="btn" onclick="details(${p.id})">Details</button><button class="btn blue" onclick="add(${p.id})">🛒 Add</button></div></div></article>`).join("")}
function add(id){let x=cart.find(a=>a.id===id);x?x.qty++:cart.push({id,qty:1});save()}
function details(id){let p=products.find(x=>x.id===id);show(`<button class="close" onclick="closeM()">✕</button><div class="detail"><img src="${p.img}"><div><span class="tag">${p.cat}</span><h2>${p.name}</h2><div class="price">${money(p.price)}</div><p class="desc">${p.desc}</p><div class="notice">🚚 Cash on Delivery<br>📞 ${PHONE}</div><button class="btn blue" style="width:100%;margin-top:12px" onclick="add(${p.id});closeM()">🛒 Add to Cart</button></div></div>`)}
function cartOpen(){let rows=cart.map(x=>{let p=products.find(a=>a.id===x.id);return `<div class="row"><span>${p.name} × ${x.qty}</span><b>${money(p.price*x.qty)}</b></div>`});let total=cart.reduce((s,x)=>s+products.find(p=>p.id===x.id).price*x.qty,0);show(`<button class="close" onclick="closeM()">✕</button><h2>🛒 Cart & Checkout</h2><div class="sum">${rows.length?rows.join(""):"Cart খালি"}${rows.length?`<div class="row total"><span>মোট</span><span>${money(total)}</span></div>`:""}</div>${rows.length?`<div class="notice">💵 Payment: Cash on Delivery</div><div class="field"><label>নাম *</label><input id="name" placeholder="আপনার নাম"></div><div class="field"><label>ফোন *</label><input id="phone" placeholder="01XXXXXXXXX"></div><div class="field"><label>সম্পূর্ণ ঠিকানা *</label><textarea id="addr" placeholder="বাড়ি/রোড, এলাকা, থানা, জেলা"></textarea></div><button class="btn blue" style="width:100%" onclick="order()">💬 WhatsApp-এ Order পাঠান</button><a class="btn dark" style="display:block;text-align:center;margin-top:8px" href="tel:${PHONE}">📞 ফোনে Order করুন</a>`:""}`)}
function order(){let n=document.getElementById("name").value.trim(),ph=document.getElementById("phone").value.trim(),ad=document.getElementById("addr").value.trim();if(!n||!ph||!ad)return alert("নাম, ফোন ও ঠিকানা দিন।");let total=0,items=cart.map(x=>{let p=products.find(a=>a.id===x.id);total+=p.price*x.qty;return p.name+" × "+x.qty+" = "+money(p.price*x.qty)}).join("\n");let msg=`BD Bazar Order%0A%0Aনাম: ${encodeURIComponent(n)}%0Aফোন: ${encodeURIComponent(ph)}%0Aঠিকানা: ${encodeURIComponent(ad)}%0A%0Aপণ্য:%0A${encodeURIComponent(items)}%0A%0ামোট: ${money(total)}%0APayment: Cash on Delivery`;window.open(`https://wa.me/${WA}?text=${msg}`,"_blank")}
function show(x){document.getElementById("box").innerHTML=x;document.getElementById("modal").classList.add("on")}function closeM(){document.getElementById("modal").classList.remove("on")}save();render();
</script></body></html>
