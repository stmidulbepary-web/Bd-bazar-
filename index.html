<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BD Bazar — Gadget Shop</title>

<style>
:root{
  --blue:#1769ff;
  --dark:#101828;
  --muted:#667085;
  --bg:#f5f7fb;
  --green:#12b76a;
}
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,"Noto Sans Bengali",sans-serif;
  background:var(--bg);
  color:var(--dark)
}
button,input,textarea,select{font:inherit}
button{cursor:pointer;border:0}
.nav{
  position:sticky;
  top:0;
  z-index:10;
  background:#fff;
  border-bottom:1px solid #e5e7eb;
  padding:13px 18px;
  display:flex;
  gap:12px;
  align-items:center
}
.logo{
  font-size:24px;
  font-weight:900;
  white-space:nowrap
}
.logo b{color:var(--blue)}
.search{flex:1}
.search input{
  width:100%;
  padding:12px 15px;
  border:1px solid #ddd;
  border-radius:13px;
  outline:none
}
.btn{
  padding:12px 15px;
  border-radius:12px;
  font-weight:800
}
.blue{background:var(--blue);color:#fff}
.dark{background:var(--dark);color:#fff}
.green{background:var(--green);color:#fff}
.wrap{
  max-width:1150px;
  margin:auto;
  padding:20px
}
.hero{
  padding:35px 25px;
  border-radius:25px;
  color:#fff;
  background:linear-gradient(120deg,#12213f,#1769ff);
  margin-bottom:25px
}
.hero h1{
  font-size:clamp(30px,5vw,50px);
  margin:0 0 10px
}
.hero p{
  font-size:17px;
  line-height:1.7
}
.grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:18px
}
.card{
  background:#fff;
  border:1px solid #e5e7eb;
  border-radius:19px;
  overflow:hidden
}
.pic{
  width:100%;
  aspect-ratio:1.15;
  object-fit:cover;
  background:#eef4ff
}
.body{padding:15px}
.tag{
  color:#175cd3;
  background:#eaf2ff;
  padding:5px 9px;
  border-radius:99px;
  font-size:12px;
  font-weight:bold
}
.card h3{margin:10px 0 5px}
.desc{
  color:var(--muted);
  line-height:1.5;
  min-height:42px
}
.price{
  font-size:22px;
  font-weight:900;
  margin:12px 0
}
.actions{
  display:flex;
  gap:8px
}
.actions button{flex:1}
.modal{
  display:none;
  position:fixed;
  inset:0;
  background:#0008;
  z-index:30;
  padding:18px;
  overflow:auto
}
.modal.on{
  display:flex;
  align-items:center;
  justify-content:center
}
.box{
  background:#fff;
  border-radius:20px;
  padding:20px;
  width:min(720px,100%);
  position:relative
}
.close{
  position:absolute;
  right:12px;
  top:10px;
  border-radius:50%;
  padding:8px 12px;
  background:#eee
}
.detail{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:20px
}
.detail img{
  width:100%;
  border-radius:15px
}
.field{margin:11px 0}
.field label{
  display:block;
  font-weight:bold;
  margin-bottom:5px
}
.field input,
.field textarea,
.field select{
  width:100%;
  padding:12px;
  border:1px solid #ddd;
  border-radius:11px;
  outline:none
}
.field textarea{min-height:85px}
.sum{
  background:#f8fafc;
  padding:12px;
  border-radius:12px;
  margin:12px 0
}
.row{
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:7px 0
}
.total{
  border-top:1px solid #ddd;
  font-weight:900;
  font-size:19px;
  margin-top:5px;
  padding-top:12px
}
.notice{
  background:#ecfdf3;
  color:#067647;
  padding:12px;
  border-radius:11px;
  line-height:1.6
}
.delivery{
  background:#eff8ff;
  color:#175cd3;
  padding:13px;
  border-radius:12px;
  margin:12px 0;
  line-height:1.7
}
.payment{
  background:#fff7ed;
  color:#9a3412;
  padding:14px;
  border-radius:12px;
  margin:12px 0;
  line-height:1.7
}
.empty{
  background:#fff;
  padding:30px;
  border-radius:15px;
  text-align:center;
  color:var(--muted)
}
.success{
  text-align:center;
  padding:20px
}
.success .icon{font-size:55px}
.foot{
  background:#0b1220;
  color:#ddd;
  padding:30px 20px;
  margin-top:30px
}
@media(max-width:800px){
  .grid{grid-template-columns:repeat(2,1fr)}
  .detail{grid-template-columns:1fr}
}
@media(max-width:550px){
  .grid{grid-template-columns:1fr}
  .nav{flex-wrap:wrap}
  .search{
    order:3;
    flex-basis:100%
  }
}
</style>
</head>

<body>

<nav class="nav">

<div class="logo">
🛍️ BD <b>Bazar</b>
</div>

<div class="search">
<input
id="q"
oninput="render()"
placeholder="পণ্য খুঁজুন...">
</div>

<a
class="btn"
href="tel:01954959814">
📞 Call
</a>

<button
class="btn dark"
onclick="cartOpen()">
🛒 Cart (<span id="cc">0</span>)
</button>

</nav>


<main class="wrap">

<section class="hero">

<h1>
BD Bazar — Gadget Store
</h1>

<p>
পছন্দের পণ্য Cart-এ যোগ করুন এবং
Cash on Delivery, bKash অথবা Nagad-এ
সহজেই অর্ডার করুন।
</p>

</section>

<h2>সব Gadget</h2>

<div
id="grid"
class="grid">
</div>

</main>


<footer class="foot">

<b>BD Bazar</b>

<p>📞 01954959814</p>

<p>💵 Cash on Delivery</p>

<p>📱 bKash • Nagad</p>

</footer>


<div
id="modal"
class="modal"
onclick="if(event.target===this)closeM()">

<div
id="box"
class="box">
</div>

</div>


<script>

/* ================================
   SETTINGS
================================ */

const WA="8801954959814";

const PHONE="01954959814";


/* SUPABASE FUNCTION */

const SUPABASE_FUNCTION=
"https://dpvjyhnhcouyaidcmlpj.supabase.co/functions/v1/bright-task";


/* DELIVERY */

const DHAKA_DELIVERY=70;

const OUTSIDE_DHAKA_DELIVERY=130;


/* PAYMENT NUMBERS */

const BKASH_NUMBER="01954959814";

const NAGAD_NUMBER="01954959814";


/* ================================
   PRODUCTS

   নতুন Product যোগ করতে এখানে
   একটি নতুন block যোগ করবে।
================================ */

const products=[

{
id:1,
name:"Wireless Mini Gadget",
price:650,
cat:"Gadgets",
img:"https://images.unsplash.com/photo-1587033411391-5d9e51cce126?auto=format&fit=crop&w=900&q=80",
desc:"ছোট ও ব্যবহারযোগ্য everyday gadget।"
},

{
id:2,
name:"Smart LED Gadget",
price:850,
cat:"Gadgets",
img:"https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=900&q=80",
desc:"Modern LED design ও আকর্ষণীয় look।"
},

{
id:3,
name:"Bluetooth Speaker",
price:1250,
cat:"Audio",
img:"https://images.unsplash.com/photo-1608043152269-423dbba4e7e1?auto=format&fit=crop&w=900&q=80",
desc:"Portable speaker—বাসা ও ভ্রমণের জন্য।"
},

{
id:4,
name:"Smart Watch",
price:1650,
cat:"Wearable",
img:"https://images.unsplash.com/photo-1523275335684-37898b6baf30?auto=format&fit=crop&w=900&q=80",
desc:"স্টাইলিশ daily-use smart watch।"
},

{
id:5,
name:"USB Rechargeable Fan",
price:790,
cat:"Home Gadget",
img:"https://images.unsplash.com/photo-1561214115-f2f134cc4912?auto=format&fit=crop&w=900&q=80",
desc:"Desk বা personal cooling-এর জন্য।"
},

{
id:6,
name:"Fast Charging Cable",
price:390,
cat:"Accessories",
img:"https://images.unsplash.com/photo-1583863788434-e58a36330cf0?auto=format&fit=crop&w=900&q=80",
desc:"দৈনন্দিন charging-এর জন্য practical cable।"
}

];


let cart=
JSON.parse(
localStorage.getItem("cart")||"[]"
);


/* ================================
   MONEY
================================ */

function money(n){

return "৳"+
Number(n).toLocaleString("bn-BD");

}


/* ================================
   SAVE
================================ */

function save(){

localStorage.setItem(
"cart",
JSON.stringify(cart)
);

document.getElementById("cc").textContent=
cart.reduce(
(a,x)=>a+x.qty,
0
);

}


/* ================================
   PRODUCTS
================================ */

function render(){

let q=
document
.getElementById("q")
.value
.toLowerCase()
.trim();


let list=
products.filter(p=>
(
p.name+
p.cat+
p.desc
)
.toLowerCase()
.includes(q)
);


if(!list.length){

document.getElementById("grid").innerHTML=`

<div class="empty">

<h3>
কোনো Product পাওয়া যায়নি
</h3>

<p>
অন্য নামে খুঁজে দেখুন।
</p>

</div>

`;

return;
}


document.getElementById("grid").innerHTML=

list.map(p=>`

<article class="card">

<img
class="pic"
src="${p.img}"
alt="${p.name}">

<div class="body">

<span class="tag">
${p.cat}
</span>

<h3>
${p.name}
</h3>

<p class="desc">
${p.desc}
</p>

<div class="price">
${money(p.price)}
</div>

<div class="actions">

<button
class="btn"
onclick="details(${p.id})">
Details
</button>

<button
class="btn blue"
onclick="add(${p.id})">
🛒 Add
</button>

</div>

</div>

</article>

`).join("");

}


/* ================================
   ADD TO CART
================================ */

function add(id){

let item=
cart.find(x=>x.id===id);


if(item){

item.qty++;

}else{

cart.push({
id:id,
qty:1
});

}


save();

}


/* ================================
   DETAILS
================================ */

function details(id){

let p=
products.find(
x=>x.id===id
);


show(`

<button
class="close"
onclick="closeM()">
✕
</button>

<div class="detail">

<img
src="${p.img}"
alt="${p.name}">

<div>

<span class="tag">
${p.cat}
</span>

<h2>
${p.name}
</h2>

<div class="price">
${money(p.price)}
</div>

<p class="desc">
${p.desc}
</p>

<div class="notice">

🚚 Delivery Available<br>
💵 Cash on Delivery<br>
📱 bKash / Nagad

</div>

<button
class="btn blue"
style="width:100%;margin-top:12px"
onclick="add(${p.id});closeM()">

🛒 Add to Cart

</button>

</div>

</div>

`);

}


/* ================================
   CART
================================ */

function cartOpen(){

if(!cart.length){

show(`

<button
class="close"
onclick="closeM()">
✕
</button>

<div class="empty">

<h2>
🛒 Cart খালি
</h2>

<p>
আগে কিছু Product Cart-এ যোগ করুন।
</p>

</div>

`);

return;

}


let rows=
cart.map(x=>{

let p=
products.find(
a=>a.id===x.id
);


return `

<div class="row">

<span>
${p.name} × ${x.qty}
</span>

<b>
${money(p.price*x.qty)}
</b>

</div>

`;

}).join("");


let subtotal=
cart.reduce(
(sum,x)=>
sum+
products.find(
p=>p.id===x.id
).price*
x.qty,
0
);


show(`

<button
class="close"
onclick="closeM()">
✕
</button>

<h2>
🛒 Cart & Checkout
</h2>


<div class="sum">

${rows}

<div class="row">

<span>
পণ্যের মূল্য
</span>

<span>
${money(subtotal)}
</span>

</div>

<div
class="row"
id="deliveryRow">

<span>
Delivery Charge
</span>

<span id="deliveryText">
Area নির্বাচন করুন
</span>

</div>

<div
class="row total">

<span>
সর্বমোট
</span>

<span id="grandTotal">
${money(subtotal)}
</span>

</div>

</div>


<div class="delivery">

🚚 <b>Delivery Charge</b>

<br>

ঢাকার ভিতরে:
<b>${money(DHAKA_DELIVERY)}</b>

<br>

ঢাকার বাইরে:
<b>${money(OUTSIDE_DHAKA_DELIVERY)}</b>

</div>


<div class="field">

<label>
নাম *
</label>

<input
id="name"
placeholder="আপনার নাম">

</div>


<div class="field">

<label>
ফোন *
</label>

<input
id="phone"
type="tel"
placeholder="01XXXXXXXXX">

</div>


<div class="field">

<label>
সম্পূর্ণ ঠিকানা *
</label>

<textarea
id="addr"
placeholder="বাড়ি/রোড, এলাকা, থানা, জেলা">
</textarea>

</div>


<div class="field">

<label>
Delivery Area *
</label>

<select
id="area"
onchange="updateDelivery()">

<option value="">
Delivery Area নির্বাচন করুন
</option>

<option value="dhaka">
ঢাকার ভিতরে — ${money(DHAKA_DELIVERY)}
</option>

<option value="outside">
ঢাকার বাইরে — ${money(OUTSIDE_DHAKA_DELIVERY)}
</option>

</select>

</div>


<div class="field">

<label>
Payment Method *
</label>

<select
id="payment"
onchange="paymentChange()">

<option value="">
Payment নির্বাচন করুন
</option>

<option value="Cash on Delivery">
💵 Cash on Delivery
</option>

<option value="bKash">
📱 bKash
</option>

<option value="Nagad">
📱 Nagad
</option>

</select>

</div>


<div
id="mobilePayment"
style="display:none">

<div class="payment">

<b>
📱 bKash / Nagad
</b>

<br><br>

bKash:
<b>${BKASH_NUMBER}</b>

<br>

Nagad:
<b>${NAGAD_NUMBER}</b>

<br><br>

Payment করার পর Order Confirm করুন।

<br>

Transaction ID লাগবে না।

</div>

</div>


<button
class="btn blue"
style="width:100%;margin-top:8px"
onclick="order()">

✅ Order Confirm করুন

</button>

`);

}


/* ================================
   PAYMENT CHANGE
================================ */

function paymentChange(){

let payment=
document.getElementById("payment").value;


document.getElementById(
"mobilePayment"
).style.display=

payment==="bKash"||
payment==="Nagad"
?"block"
:"none";

}


/* ================================
   DELIVERY
================================ */

function updateDelivery(){

let area=
document.getElementById("area").value;


let subtotal=
cart.reduce(
(sum,x)=>
sum+
products.find(
p=>p.id===x.id
).price*
x.qty,
0
);


let charge=0;


if(area==="dhaka"){

charge=DHAKA_DELIVERY;

}


if(area==="outside"){

charge=OUTSIDE_DHAKA_DELIVERY;

}


document.getElementById(
"deliveryText"
).textContent=
charge
?money(charge)
:"Area নির্বাচন করুন";


document.getElementById(
"grandTotal"
).textContent=
money(
subtotal+charge
);

}


/* ================================
   ORDER
================================ */

async function order(){

let n=
document.getElementById("name")
.value.trim();


let ph=
document.getElementById("phone")
.value.trim();


let ad=
document.getElementById("addr")
.value.trim();


let area=
document.getElementById("area")
.value;


let payment=
document.getElementById("payment")
.value;


if(!n){

alert("আপনার নাম দিন।");
return;

}


if(!ph){

alert("আপনার ফোন নম্বর দিন।");
return;

}


if(!ad){

alert("আপনার সম্পূর্ণ ঠিকানা দিন।");
return;

}


if(!area){

alert("Delivery Area নির্বাচন করুন।");
return;

}


if(!payment){

alert("Payment Method নির্বাচন করুন।");
return;

}


let deliveryCharge=
area==="dhaka"
?DHAKA_DELIVERY
:OUTSIDE_DHAKA_DELIVERY;


let subtotal=0;


let orderItems=
cart.map(x=>{

let p=
products.find(
a=>a.id===x.id
);


subtotal+=
p.price*x.qty;


return {

product_id:p.id,

product_name:p.name,

quantity:x.qty,

price:p.price

};

});


let total=
subtotal+
deliveryCharge;


let areaName=
area==="dhaka"
?"ঢাকার ভিতরে"
:"ঢাকার বাইরে";


let orderData={

customer_name:n,

phone:ph,

address:ad,

delivery_area:areaName,

delivery_charge:deliveryCharge,

items:orderItems,

subtotal:subtotal,

total:total,

payment_method:payment,

status:"new"

};


try{


let response=
await fetch(
SUPABASE_FUNCTION,
{

method:"POST",

headers:{
"Content-Type":
"application/json"
},

body:
JSON.stringify(orderData)

}
);


let result=
await response.json();


if(
!response.ok||
!result.success
){

console.error(result);

alert(
"Order save হয়নি। Supabase Database check করুন।"
);

return;

}


/* WHATSAPP */

let items=
cart.map(x=>{

let p=
products.find(
a=>a.id===x.id
);


return(
p.name+
" × "+
x.qty+
" = "+
money(
p.price*x.qty
)
);

}).join("\n");


let msg=

`BD Bazar New Order

নাম: ${n}

ফোন: ${ph}

ঠিকানা: ${ad}

Delivery: ${areaName}

পণ্য:
${items}

পণ্যের মূল্য:
${money(subtotal)}

Delivery Charge:
${money(deliveryCharge)}

সর্বমোট:
${money(total)}

Payment:
${payment}`;


window.open(
"https://wa.me/"+
WA+
"?text="+
encodeURIComponent(msg),
"_blank"
);


/* CLEAR CART */

cart=[];

save();


document.getElementById(
"box"
).innerHTML=`

<div class="success">

<div class="icon">
✅
</div>

<h2>
Order সফল হয়েছে!
</h2>

<p>
আপনার Order গ্রহণ করা হয়েছে।
</p>

<p>
আমাদের পক্ষ থেকে দ্রুত যোগাযোগ করা হবে।
</p>

<button
class="btn blue"
onclick="closeM()">

ঠিক আছে

</button>

</div>

`;


}catch(error){

console.error(error);

alert(
"Server-এর সাথে যোগাযোগ করা যাচ্ছে না।"
);

}

}


/* ================================
   MODAL
================================ */

function show(x){

document.getElementById(
"box"
).innerHTML=x;


document.getElementById(
"modal"
).classList.add("on");

}


function closeM(){

document.getElementById(
"modal"
).classList.remove("on");

}


save();

render();

</script>

</body>
</html>
